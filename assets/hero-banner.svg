<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Cyber AI hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0a1a2f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2E86DE"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#2E86DE" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="65"  x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="900" y1="0" x2="900" y2="260"/>
  </g>

  <!-- matrix rain columns (animated, GitHub-safe SMIL) -->
  <g font-family="monospace" font-size="15" fill="#34ff8a" opacity="0.35">
    <text x="60"   y="0">10110<animate attributeName="y" values="-20;280" dur="4s"   begin="0s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="0s" repeatCount="indefinite"/></text>
    <text x="150"  y="0">01001<animate attributeName="y" values="-20;280" dur="5.5s" begin="1s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="1s" repeatCount="indefinite"/></text>
    <text x="240"  y="0">AI&#9553;01<animate attributeName="y" values="-20;280" dur="3.5s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></text>
    <text x="1000" y="0">11010<animate attributeName="y" values="-20;280" dur="4.8s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="1090" y="0">0x2E8<animate attributeName="y" values="-20;280" dur="6s"   begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="6s" begin="0.2s" repeatCount="indefinite"/></text>
    <text x="1150" y="0">01101<animate attributeName="y" values="-20;280" dur="4.2s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/></text>
  </g>

  <!-- neural connections -->
  <g stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M120 130 Q240 70 360 130"/>
    <path d="M360 130 Q480 190 600 130"/>
    <path d="M840 130 Q960 70 1080 130"/>
  </g>

  <!-- nodes with pulse -->
  <g filter="url(#glow)">
    <circle cx="120" cy="130" r="5" fill="url(#node)"/>
    <circle cx="360" cy="130" r="6" fill="url(#node)"/>
    <circle cx="1080" cy="130" r="5" fill="url(#node)"/>
    <circle cx="600" cy="130" r="7" fill="url(#node)">
      <animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flowing data particles -->
  <g opacity="0.75">
    <circle cx="0" cy="130" r="2.4" fill="#00d4ff">
      <animate attributeName="cx" from="0" to="1200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="130" r="2" fill="#7dd3fc">
      <animate attributeName="cx" from="0" to="1200" dur="9.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif">
    <text x="600" y="118" font-size="46" font-weight="800" fill="url(#accent)" filter="url(#glow)">MUHAMMAD ABBAS</text>
    <text x="600" y="152" font-size="17" font-weight="500" fill="#8b98a5" letter-spacing="3">AI RESEARCH ASSISTANT &#8226; COMPUTER VISION &#8226; DEEP LEARNING</text>
  </g>

  <!-- accent underline -->
  <rect x="440" y="168" width="320" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.8">
    <animate attributeName="width" values="0;320" dur="1.4s" fill="freeze"/>
    <animate attributeName="x" values="600;440" dur="1.4s" fill="freeze"/>
  </rect>
</svg>
